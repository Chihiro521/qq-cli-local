name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install npm with trusted publishing support
        run: npm install --global 'npm@^11.15.0'
      - name: Check release tag
        shell: pwsh
        run: |
          $package = Get-Content -Raw package.json | ConvertFrom-Json
          if ($env:GITHUB_REF_NAME -ne "v$($package.version)") {
            throw "Tag $env:GITHUB_REF_NAME must match package version v$($package.version)."
          }
      - run: npm ci
      - run: npm test
      - name: Pack release archive
        id: pack
        shell: pwsh
        run: |
          $archive = npm pack --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "tarball=$($archive[0].filename)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
      - run: npm publish --access public
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          gh release create $env:GITHUB_REF_NAME $env:PACKAGE_TARBALL --verify-tag --title "qq-cli $env:GITHUB_REF_NAME" --generate-notes
